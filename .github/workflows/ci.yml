name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff, incl. flake8-bandit rules)
        run: ruff check .
      - name: Security scan (bandit)
        run: bandit -r src/ -c pyproject.toml
      - name: Tests (offline)
        run: pytest -v
      - name: Smoke test CLI
        run: reconvigil rules

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t reconvigil:ci .
      - name: Verify non-root and default command
        run: |
          test "$(docker run --rm --entrypoint id reconvigil:ci -u)" = "10001"
          docker run --rm reconvigil:ci --help
