[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconvigil"
version = "0.1.0"
description = "Security-hardened Attack Surface Management & web reconnaissance engine"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Efe Güçlütürk" }]
keywords = ["security", "reconnaissance", "attack-surface", "asm", "subdomain-takeover"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "bandit[toml]>=1.7",
]

[project.scripts]
reconvigil = "reconvigil.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reconvigil"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S113", "S110"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
